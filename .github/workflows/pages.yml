name: Deploy PaperPilot WebMCP demo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "public/webmcp/**"
      - "scripts/package-webmcp-pages.mjs"
      - "scripts/package-webmcp-pages.test.mjs"
      - "spikes/webmcp-contract/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.webmcp.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned browser dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck the WebMCP implementation
        run: npm run typecheck:webmcp

      - name: Verify WebMCP contracts and real PDF fixtures
        run: npm run test:webmcp:contracts

      - name: Verify reproducible and safe Pages packaging
        run: npm run test:webmcp:pages

      - name: Package the redesigned demo without paper bytes
        run: npm run webmcp:pages:build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the public prototype
        uses: actions/upload-pages-artifact@v3
        with:
          path: .paperpilot-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
