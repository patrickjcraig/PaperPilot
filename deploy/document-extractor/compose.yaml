name: paperpilot-document-extractor

services:
  extractor:
    image: "${PAPERPILOT_EXTRACTOR_IMAGE:-paperpilot/document-extractor:local}"
    build:
      context: ../..
      dockerfile: services/document-extractor/Dockerfile
      args:
        NODE_IMAGE: "${PAPERPILOT_EXTRACTOR_NODE_IMAGE:-node:24.20.0-trixie-slim@sha256:50c3b2f6988dfc307b86e5301d69611af31f4789bdf232863b07d3b02fe55ae0}"
        CA_CERTIFICATES_DEBIAN_VERSION: "${PAPERPILOT_EXTRACTOR_CA_CERTIFICATES_DEBIAN_VERSION:-20250419}"
        POPPLER_DEBIAN_VERSION: "${PAPERPILOT_EXTRACTOR_POPPLER_DEBIAN_VERSION:-25.03.0-5+deb13u4}"
        TINI_DEBIAN_VERSION: "${PAPERPILOT_EXTRACTOR_TINI_DEBIAN_VERSION:-0.19.0-3+b7}"
    environment:
      PAPERPILOT_EXTRACTOR_BEARER_SECRET: "${PAPERPILOT_EXTRACTOR_BEARER_SECRET:?Set a unique 32+ character bearer secret}"
      PAPERPILOT_EXTRACTOR_POLICY_VERSION: "${PAPERPILOT_EXTRACTOR_POLICY_VERSION:-paperpilot-text-extraction-v1}"
      PAPERPILOT_EXTRACTOR_TOOLCHAIN_DIGEST: "${PAPERPILOT_EXTRACTOR_TOOLCHAIN_DIGEST:?Set the release provenance SHA-256}"
      PAPERPILOT_EXTRACTOR_HOST: "0.0.0.0"
      PAPERPILOT_EXTRACTOR_PORT: "4020"
      PAPERPILOT_EXTRACTOR_ROUTE: "/v1/extract-pdf"
      PAPERPILOT_EXTRACTOR_TEMP_ROOT: "/private/ephemeral/paperpilot-extractor"
      PAPERPILOT_EXTRACTOR_MAX_BODY_BYTES: "26214400"
      PAPERPILOT_EXTRACTOR_MAX_PAGES: "2000"
      PAPERPILOT_EXTRACTOR_MAX_TEXT_BYTES: "4194304"
      PAPERPILOT_EXTRACTOR_MAX_CHUNKS: "4096"
      PAPERPILOT_EXTRACTOR_MAX_CHUNK_BYTES: "8192"
      PAPERPILOT_EXTRACTOR_MAX_RESPONSE_BYTES: "8388608"
      PAPERPILOT_EXTRACTOR_BODY_IDLE_TIMEOUT_MS: "3000"
      PAPERPILOT_EXTRACTOR_BODY_ABSOLUTE_TIMEOUT_MS: "5000"
      PAPERPILOT_EXTRACTOR_EXTRACTION_TIMEOUT_MS: "45000"
      PAPERPILOT_EXTRACTOR_READINESS_TIMEOUT_MS: "3000"
      PAPERPILOT_EXTRACTOR_MAX_CONCURRENT: "1"
      PAPERPILOT_EXTRACTOR_SINGLE_USE: "1"
      PAPERPILOT_EXTRACTOR_PDFTOTEXT_COMMAND: "pdftotext"
      PAPERPILOT_EXTRACTOR_PDFINFO_COMMAND: "pdfinfo"
      PAPERPILOT_EXTRACTOR_POPPLER_COMMAND_TIMEOUT_MS: "15000"
      PAPERPILOT_EXTRACTOR_POPPLER_MAX_RAW_TEXT_BYTES: "8388608"
    tmpfs:
      - /private/ephemeral/paperpilot-extractor:rw,noexec,nosuid,nodev,size=64m,mode=0700,uid=1000,gid=1000
    ports:
      - "${PAPERPILOT_EXTRACTOR_BIND_ADDRESS:-127.0.0.1}:${PAPERPILOT_EXTRACTOR_PUBLISHED_PORT:-4020}:4020"
    networks:
      - extraction
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 1g
    cpus: 2.0
    ulimits:
      nofile:
        soft: 256
        hard: 256
    stop_grace_period: 15s
    restart: always

networks:
  extraction:
    internal: true
